<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>指尖魔法 - 3D粒子交互特效</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            position: fixed;
            overflow: hidden;
        }

        body {
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            touch-action: none;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #webcam {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 120px;
            height: 90px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 8px;
            z-index: 100;
            transform: scaleX(-1);
            object-fit: cover;
            background: #111;
        }

        @media (max-width: 768px) {
            #webcam {
                width: 100px;
                height: 75px;
                bottom: 8px;
                right: 8px;
            }
        }

        @media (max-width: 480px) {
            #webcam {
                width: 80px;
                height: 60px;
            }
        }

        #controls {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 100;
        }

        #fullscreen-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 16px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            user-select: none;
            -webkit-user-select: none;
        }

        #fullscreen-btn:active {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0.95);
        }

        #status {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
            text-align: center;
            z-index: 50;
            pointer-events: none;
            transition: opacity 0.5s;
            padding: 0 20px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            #status {
                font-size: 15px;
            }
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            transition: opacity 0.5s;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00ffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: rgba(255, 255, 255, 0.7);
            margin-top: 20px;
            font-size: 14px;
        }

        .hint-text {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            z-index: 100;
            text-align: center;
            padding: 0 15px;
            line-height: 1.4;
            width: 100%;
            max-width: 600px;
        }

        @media (min-width: 768px) {
            .hint-text {
                font-size: 13px;
                bottom: 20px;
            }
        }

        .mobile-controls {
            display: none;
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            gap: 10px;
        }

        @media (max-width: 768px) {
            .mobile-controls {
                display: flex;
            }
        }

        .mobile-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 12px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .mobile-btn:active {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="loader"></div>
        <div class="loading-text">正在加载魔法引擎...</div>
    </div>

    <div id="canvas-container"></div>
    <video id="webcam" autoplay playsinline muted></video>

    <div id="controls">
        <button id="fullscreen-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/>
            </svg>
            全屏
        </button>
    </div>

    <div id="status">
        <div>等待摄像头连接...</div>
        <div style="font-size: 12px; margin-top: 10px;">请允许访问摄像头以体验指尖魔法</div>
    </div>

    <div class="mobile-controls" id="mobile-controls">
        <button class="mobile-btn" data-action="1">👆 1</button>
        <button class="mobile-btn" data-action="2">✌️ 2</button>
        <button class="mobile-btn" data-action="3">3️⃣ 3</button>
        <button class="mobile-btn" data-action="5">🖐️ U</button>
        <button class="mobile-btn" data-action="0">✊ 重置</button>
    </div>

    <div class="hint-text">
        👆1根手指 - 数字1 &nbsp;|&nbsp; ✌️2根手指 - 数字2 &nbsp;|&nbsp; 3️⃣3根手指 - 数字3 &nbsp;|&nbsp; 🖐️5指 - U字告白 &nbsp;|&nbsp; ✊握拳 - 重置
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <script src="app.js"></script>
</body>
</html>
